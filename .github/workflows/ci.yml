name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel an in-flight Pages deployment on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      # Self-hosting download: same app built for a domain root, zipped into
      # the Pages output so it is served at <pages-url>/repile-static.zip.
      - name: Static build (base /)
        run: |
          out="$RUNNER_TEMP/repile-static"
          npx vite build --outDir "$out" --emptyOutDir
          cp "$out/index.html" "$out/404.html"
          cd "$RUNNER_TEMP" && python3 -m zipfile -c "$GITHUB_WORKSPACE/dist/repile-static.zip" repile-static/
        env:
          VITE_BASE: /
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
